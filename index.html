<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Play 2D Ping Pong Online | VRuntime Labs</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
    }
    canvas {
      border: 4px solid #38bdf8;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      max-width: 100%;
      display: block;
    }
    .touch-controls {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .touch-btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .touch-btn:active {
      background: #0284c7;
    }
    .instructions {
      margin-top: 10px;
      color: #94a3b8;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🏓 Ping Pong</h1>
  <canvas id="pong" width="600" height="400"></canvas>

  <div class="touch-controls">
    <button class="touch-btn" id="upBtn">▲ UP</button>
    <button class="touch-btn" id="downBtn">▼ DOWN</button>
  </div>

  <p class="instructions">Use <strong>W / S</strong> or <strong>Up / Down</strong> keys on Desktop, or buttons above on Mobile.</p>

  <script src="./game.js"></script>
</body>
</html>
